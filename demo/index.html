<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme, or the system one on a first visit, before the first paint.
      try {
        var t = localStorage.getItem('skilleval-theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <title>SkillEval: interpretable ability profiles of LLMs</title>
    <meta
      name="description"
      content="Skill profiles of 3,811 open language models on 100 named skills, from a cognitive diagnosis model fitted to their answers to 9,523 items of MATH, BBH, GPQA, MuSR and IFEval."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SkillEval" />
    <meta
      property="og:description"
      content="Skill profiles of 3,811 open language models on 100 named skills, from a cognitive diagnosis model."
    />
    <meta property="og:url" content="https://berkearda.github.io/skilleval/" />
    <meta
      property="og:image"
      content="https://berkearda.github.io/skilleval/og.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
