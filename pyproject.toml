[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdmeval"
version = "0.2.0"
description = "SkillEval: skill-level evaluation of large language models with cognitive diagnosis models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Nizamettin Berke Arda"},
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "tqdm>=4.66",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3",
    "sentence-transformers>=2.7",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7", "seaborn>=0.13"]
extract = ["openai>=1.0", "anthropic>=0.30"]
clustering = ["hdbscan>=0.8.33", "umap-learn>=0.5"]
baselines = ["EduCDM==0.0.13"]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
include = ["cdmeval*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
