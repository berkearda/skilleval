[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdmeval"
version = "0.1.0"
description = "Skill-aware cognitive diagnostic modeling for LLM evaluation and routing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Nizamettin Berke Arda"},
]

dependencies = [
    "EduCDM==0.0.13",
    "anthropic==0.72.0",
    "hdbscan==0.8.40",
    "matplotlib==3.7.5",
    "numpy==1.24.4",
    "pandas==2.0.3",
    "scikit-learn==1.3.2",
    "seaborn==0.13.2",
    "sentence-transformers==3.2.1",
    "torch==2.4.1",
    "tqdm==4.66.5",
    "umap-learn==0.5.7",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
data = ["datasets>=2.0"]

[tool.setuptools.packages.find]
include = ["cdmeval*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
